<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Automator</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo"></div>
          <h1>Automator</h1>
        </div>

        <div class="platform-section">
          <h3>Select Platforms</h3>
          <div class="platform-list">
            <label class="platform-item">
              <input type="checkbox" name="platform" value="threads" checked />
              <span class="platform-box">
                <span class="platform-icon"></span>
                <span class="platform-details">
                  <span class="platform-name">Threads</span>
                  <span class="platform-limit">500 chars</span>
                </span>
                <span class="platform-checkmark">✓</span>
              </span>
            </label>

            <label class="platform-item">
              <input type="checkbox" name="platform" value="instagram" />
              <span class="platform-box">
                <span class="platform-icon"></span>
                <span class="platform-details">
                  <span class="platform-name">Instagram</span>
                  <span class="platform-limit">2200 chars</span>
                </span>
                <span class="platform-checkmark">✓</span>
              </span>
            </label>

            <label class="platform-item">
              <input type="checkbox" name="platform" value="twitter" />
              <span class="platform-box">
                <span class="platform-icon"></span>
                <span class="platform-details">
                  <span class="platform-name">X / Twitter</span>
                  <span class="platform-limit">280 chars</span>
                </span>
                <span class="platform-checkmark">✓</span>
              </span>
            </label>

            <label class="platform-item">
              <input type="checkbox" name="platform" value="linkedin" />
              <span class="platform-box">
                <span class="platform-icon"></span>
                <span class="platform-details">
                  <span class="platform-name">LinkedIn</span>
                  <span class="platform-limit">3000 chars</span>
                </span>
                <span class="platform-checkmark">✓</span>
              </span>
            </label>
          </div>
        </div>

        <div class="sidebar-footer">
          <span id="platformCount">1</span> platform selected
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Compose Card -->
        <div class="card compose-card">
          <div class="card-header">
            <h2>Compose</h2>
            <button id="clearBtn" class="btn-ghost" title="Clear all">
              Clear
            </button>
          </div>

          <div class="card-body">
            <div class="form-group">
              <textarea
                id="descriptionInput"
                class="input-main"
                placeholder="What's on your mind? Write your post here..."
                maxlength="5000"
                rows="5"
              ></textarea>
              <div class="input-footer">
                <span class="char-count"
                  ><span id="charCount">0</span> / 5000</span
                >
              </div>
            </div>

            <details class="expandable">
              <summary>
                <span>Media Source</span>
                <span class="optional-badge">Optional</span>
              </summary>
              <textarea
                id="mediaSourceInput"
                placeholder="Examples:&#10;• Gallery recent 5 images&#10;• All media between Jan 4 and Jan 6&#10;• WhatsApp chat with +91XXXXXXXXXX&#10;• Screenshots from today"
                rows="3"
              ></textarea>
            </details>

            <details class="expandable">
              <summary>
                <span>Add Links</span>
                <span class="optional-badge">Optional</span>
              </summary>
              <textarea
                id="linksInput"
                placeholder="Paste links (one per line)..."
                rows="2"
              ></textarea>
            </details>
          </div>

          <div class="card-footer">
            <button id="postBtn" class="btn-primary">Post Now</button>
          </div>
        </div>

        <!-- Terminal Card -->
        <div class="card terminal-card">
          <div class="terminal-header">
            <div class="terminal-dots">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
              <span class="terminal-title">Agent Output</span>
            </div>
            <div class="terminal-actions">
              <span id="statusIndicator" class="status-badge idle">● Idle</span>
              <button id="clearLogBtn" class="btn-small">Clear</button>
            </div>
          </div>

          <div id="terminalLog" class="terminal-body">
            <div class="log-info">[Ready] Waiting for task...</div>
          </div>

          <div class="progress-bar-wrap hidden" id="progressInline">
            <div class="progress-track">
              <div id="progressFillInline" class="progress-fill"></div>
            </div>
            <span id="progressTextInline">0%</span>
          </div>
        </div>

        <!-- Results Card -->
        <div id="resultsSection" class="card results-card hidden">
          <div class="card-header">
            <h2>Results</h2>
          </div>
          <div id="resultsList" class="results-list"></div>
        </div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
